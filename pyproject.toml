[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medalcode-mcp-servers"
version = "1.0.0"
description = "Unified MCP servers monorepo: Browser, Route, Scrape, Doc, LinkedIn, Pathwise"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Jonatthan Medalla", email = "152304407+Medalcode@users.noreply.github.com"},
]
keywords = ["mcp", "model-context-protocol", "browser-automation", "ai-router", "web-scraping", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "html5lib>=1.1",
    "lxml>=5.0.0",
    "selenium>=4.30.0",
    "pymupdf>=1.23.0",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
    "aiosqlite>=0.19.0",
    "playwright>=1.40.0",
    "duckduckgo-search>=8.1.1",
    "graphifyy>=0.0.1",
]

[project.optional-dependencies]
duckdb = ["duckdb>=1.0.0"]
github = ["pygithub>=2.0.0"]
email = ["google-api-python-client>=2.0.0", "google-auth-oauthlib>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "bandit>=1.7.0",
    "flake8>=7.0.0",
    "ruff>=0.4.0"
]
all = [
    "medalcode-mcp-servers[duckdb,github,email]",
]

[project.urls]
Homepage = "https://github.com/Medalcode/mcp-servers"
Repository = "https://github.com/Medalcode/mcp-servers"
"Bug Tracker" = "https://github.com/Medalcode/mcp-servers/issues"

[project.scripts]
browsermcp = "servers.browser:main"
routemcp = "servers.route:main"
scrapemcp = "servers.scrape:main"
docmcp = "servers.doc:main"
linkedinmcp = "servers.linkedin:main"
pathwise = "servers.pathwise:main"
pathwise-pipeline = "tools.pipeline.main:main"
memorymcp = "servers.memory:main"
githubmcp = "servers.github_mcp:main"
databasemcp = "servers.database_mcp:main"
emailmcp = "servers.email_mcp:main"
tasktracker = "servers.task_tracker:main"
graphifymcp = "servers.graphify_wrapper:main"

[tool.hatch.build.targets.wheel]
packages = ["servers", "engines", "router", "router.providers", "scrapers", "docmcp", "database", "database.repos", "tools", "tools.pipeline", "services", "services.scrapers", "memory_engine", "gh_mcp", "db_mcp", "email_mcp", "task_tracker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff.lint]
