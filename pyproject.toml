[project]
name = "mcp-servers"
version = "1.0.0"
description = "Unified MCP servers monorepo: Browser, Route, Scrape, Doc, LinkedIn, Pathwise"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "selenium>=4.30.0",
    "pymupdf>=1.23.0",
    "reportlab>=4.0.0",
    "pypdf>=4.0.0",
    "pypdf2>=3.0.0",
    "html5lib>=1.1",
    "python-dotenv>=1.0.0",
]

[project.scripts]
browsermcp = "servers.browser:main"
routemcp = "servers.route:main"
scrapemcp = "servers.scrape:main"
docmcp = "servers.doc:main"
linkedinmcp = "servers.linkedin:main"
pathwise = "servers.pathwise:main"

[tool.setuptools]
packages = [
    "servers", "engines", "router", "router.providers",
    "scrapers", "docmcp", "database", "database.repos",
    "tools", "services", "services.scrapers",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.urls]
Source = "https://github.com/medalcode/mcp-servers"
